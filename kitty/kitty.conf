touch_scroll_multiplier 10.0
background_opacity 0.3
dynamic_background_opacity yes
foreground #ffffff
font_family      SF Mono
bold_font        SF Mono Bold
italic_font      SF Mono Regular Italic
bold_italic_font SF Mono Bold Italic
font_size        11.0

map ctrl+v       paste_from_clipboard

map ctrl+plus    change_font_size all +0.5
map ctrl+equal   change_font_size all +0.5
map ctrl+minus   change_font_size all -0.5
map ctrl+0       change_font_size all 0

map ctrl+shift+h
map ctrl+shift+j
map ctrl+shift+k
map ctrl+shift+l
map ctrl+shift+left
map ctrl+shift+right
map ctrl+shift+up
map ctrl+shift+down

mouse_map left click grabbed,ungrabbed mouse_handle_click selection link prompt
